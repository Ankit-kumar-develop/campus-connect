<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Connect — SRM Student Community</title>
<style>
:root{
  --bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#667085;
  --primary:#2563eb;--primary-dark:#1d4ed8;--soft:#eaf2ff;
  --border:#e3e8f0;--success:#138a72;--shadow:0 10px 30px rgba(20,35,70,.08)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}
.nav{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 5%;gap:24px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#102a43,#2563eb);color:#fff;display:grid;place-items:center}
.nav-links{display:flex;gap:5px;flex:1}
.nav-links button{background:transparent;color:var(--muted);padding:9px 11px;border-radius:9px}
.nav-links button:hover,.nav-links button.active{background:var(--soft);color:var(--primary);font-weight:700}
.nav-user{display:flex;align-items:center;gap:9px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:800}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#f1f4f8}
.main{max-width:1250px;margin:auto;padding:28px 5% 80px}
.hero{background:linear-gradient(120deg,#102a43,#2563eb);color:#fff;border-radius:23px;padding:32px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:25px}
.hero h1{font-size:36px;max-width:680px;line-height:1.12}
.hero p{max-width:650px;line-height:1.6;color:#e6efff;margin:12px 0 20px}
.hero-badge{background:#ffffff18;border:1px solid #ffffff2d;padding:15px 18px;border-radius:15px;text-align:center;min-width:150px}
.hero-badge b{display:block;font-size:28px}
.tag{display:inline-flex;padding:5px 8px;border-radius:7px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:800}
.btn{padding:11px 15px;border-radius:10px;font-weight:750}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:#eef1f6;color:var(--text)}
.grid{display:grid;gap:18px}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:20px;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;justify-content:space-between}.stat p{color:var(--muted);font-size:13px}.stat h3{font-size:27px;margin-top:5px}
.stat-icon{width:45px;height:45px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:21px}
.section-head,.page-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:25px 0 13px}
.page-title h1{font-size:32px}.page-title p{color:var(--muted);margin-top:5px}.section-head h2{font-size:20px}
.muted{color:var(--muted)}
.event-card{padding:0;overflow:hidden}.event-cover{height:120px;padding:16px;color:#fff;display:flex;justify-content:space-between;background:linear-gradient(135deg,#2563eb,#6366f1)}
.event-cover.culture{background:linear-gradient(135deg,#be185d,#ec4899)}.event-cover.sports{background:linear-gradient(135deg,#b45309,#f59e0b)}
.event-cover.tech{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.event-body{padding:18px}.event-body h3{margin:9px 0}.event-meta{font-size:13px;line-height:1.8;color:var(--muted)}.event-actions{display:flex;gap:8px;margin-top:13px}.event-actions .btn{flex:1}
.searchbar{display:flex;gap:10px;margin-bottom:18px}.searchbar input{flex:1}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:0}
textarea{min-height:100px;resize:vertical}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.club-icon{width:54px;height:54px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:25px}.club-card h3{margin:12px 0 7px}
.pill-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:700}
.post{display:flex;gap:13px}.post-content{flex:1}.post-head{display:flex;justify-content:space-between}.post-name{font-weight:800}.post-text{margin:9px 0 13px;line-height:1.5}.post-actions{display:flex;gap:17px;color:var(--muted);font-size:13px}.post-actions button{background:transparent;color:inherit}
.member-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:var(--muted);font-size:13px}
.notice{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--border)}.notice:last-child{border-bottom:0}.notice-icon{width:42px;height:42px;flex:none;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.team-card{border-top:4px solid var(--primary)}.team-meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.team-meta span{font-size:12px;padding:5px 8px;border-radius:20px;background:#f0f3f7;color:#475467}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.filters button{background:#eef1f6;padding:8px 12px;border-radius:20px;color:#475467}.filters button.active{background:var(--primary);color:#fff}
.profile-cover{height:150px;background:linear-gradient(120deg,#102a43,#2563eb);border-radius:18px 18px 0 0}.profile-info{padding:0 24px 24px;margin-top:-38px}.profile-avatar{width:82px;height:82px;border:5px solid #fff;font-size:25px}
.modal-bg{position:fixed;inset:0;background:#0d102399;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:24px}.modal-head{display:flex;justify-content:space-between;margin-bottom:18px}.close{width:35px;height:35px;border-radius:9px;background:#eef1f5}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:13px 17px;border-radius:11px;display:none;z-index:100}.toast.show{display:block}
.login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.login-brand{background:linear-gradient(145deg,#102a43,#2563eb);color:#fff;padding:8%;display:flex;flex-direction:column;justify-content:center}.login-brand h1{font-size:50px;line-height:1.05;margin-top:18px}.login-brand p{max-width:550px;color:#e6efff;line-height:1.7;margin:18px 0 28px}.feature-list{display:grid;gap:11px}
.login-panel{display:flex;align-items:center;justify-content:center;padding:8%;background:#fff}.login-box{width:min(430px,100%)}.login-box h2{font-size:29px}.login-box>p{color:var(--muted);margin:7px 0 24px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f7;padding:4px;border-radius:10px;margin-bottom:20px}.auth-tabs button{padding:10px;border-radius:8px;background:transparent;color:var(--muted)}.auth-tabs button.active{background:#fff;color:var(--primary);font-weight:800}.auth-note{font-size:12px;color:var(--muted);background:#f7f8fa;padding:11px;border-radius:9px;margin-top:14px}
.mobile-nav{display:none}
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}.nav-links{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:7px}.mobile-nav button{background:transparent;font-size:11px;color:var(--muted)}}
@media(max-width:600px){.grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:28px}.hero-badge{display:none}.page-title{align-items:flex-start;flex-direction:column}.login-shell{grid-template-columns:1fr}.login-brand{display:none}.main{padding:22px 4% 85px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

var KEY="campusConnectUserStable";
var DATA_KEY="campusConnectDataStable";
var TEAM_KEY="campusConnectTeamsStable";

var seed={
  events:[
    {id:1,title:"HackSRM 2026",category:"Technical",date:"25 Sep 2026",time:"10:00 AM",place:"Tech Park",members:128,desc:"Build, collaborate and solve real-world problems in a campus hackathon.",type:"tech"},
    {id:2,title:"Cultural Night",category:"Cultural",date:"27 Sep 2026",time:"6:00 PM",place:"Dr. T. P. Ganesan Auditorium",members:342,desc:"Music, dance and performances from students across the campus.",type:"culture"},
    {id:3,title:"Inter-Department Football",category:"Sports",date:"30 Sep 2026",time:"4:00 PM",place:"University Ground",members:96,desc:"Represent your department and compete for the campus championship.",type:"sports"},
    {id:4,title:"AI & Future of Work",category:"Workshop",date:"03 Oct 2026",time:"11:00 AM",place:"Seminar Hall 2",members:74,desc:"An interactive session on AI, careers and the future of technology.",type:"tech"}
  ],
  clubs:[
    {id:1,name:"Coding Club",icon:"💻",members:356,about:"Programming, hackathons, competitive coding and developer communities.",tags:["Coding","Hackathons","DSA"]},
    {id:2,name:"Photography Club",icon:"📸",members:214,about:"Capture campus life, learn photography and work on creative projects.",tags:["Photography","Editing","Creative"]},
    {id:3,name:"E-Cell SRM",icon:"🚀",members:481,about:"Entrepreneurship, startup ideas, pitching and innovation.",tags:["Startups","Business","Innovation"]},
    {id:4,name:"Music Club",icon:"🎵",members:188,about:"For singers, musicians, producers and anyone who loves music.",tags:["Music","Performance","Beats"]}
  ],
  posts:[
    {id:1,name:"Rahul Sharma",year:"CSE • 3rd Year",avatar:"RS",text:"Anyone interested in forming a team for HackSRM? Looking for a frontend developer and an ML person.",likes:31,comments:8,tag:"Team Finder"},
    {id:2,name:"Priya Nair",year:"ECE • 2nd Year",avatar:"PN",text:"What do you guys think about extending library timings during exam week?",likes:56,comments:19,tag:"Campus Life"},
    {id:3,name:"Arjun K",year:"CSE • 2nd Year",avatar:"AK",text:"Photography Club is conducting a street photography walk this weekend. Who's joining?",likes:22,comments:4,tag:"Clubs"}
  ],
  students:[
    {name:"Ankit Kumar",dept:"CSE",year:"2nd Year",skills:["JavaScript","Python","C++"],interests:["AI","Photography"],avatar:"AK"},
    {name:"Rahul Sharma",dept:"CSE",year:"3rd Year",skills:["React","Node.js","Python"],interests:["Hackathons","AI"],avatar:"RS"},
    {name:"Priya Nair",dept:"ECE",year:"2nd Year",skills:["Java","IoT","C"],interests:["Robotics","Music"],avatar:"PN"},
    {name:"Aarav Menon",dept:"CSE",year:"2nd Year",skills:["Figma","UI/UX","JavaScript"],interests:["Design","Startups"],avatar:"AM"}
  ]
};

var teamSeed=[
  {id:1,title:"APP Project — Campus Utility",owner:"Rahul Sharma",dept:"CSE",year:"3rd Year",skills:["JavaScript","UI/UX"],need:["Backend","Testing"],type:"Academic",desc:"Looking for students interested in building a small campus utility for an APP project."},
  {id:2,title:"Hackathon Team — Web App",owner:"Priya Nair",dept:"ECE",year:"2nd Year",skills:["IoT","Java"],need:["Frontend","Pitching"],type:"Hackathon",desc:"Need teammates who enjoy building and presenting practical student-focused ideas."},
  {id:3,title:"Photography + Tech Project",owner:"Aarav Menon",dept:"CSE",year:"2nd Year",skills:["Figma","Photography"],need:["JavaScript","Content"],type:"Creative",desc:"Looking for students who want to combine campus photography with an interactive web experience."}
];

var notices=[
  {type:"Academic",title:"APP project review",text:"Keep your project prototype and explanation ready for the upcoming review.",time:"Today"},
  {type:"Club",title:"Coding Club workshop",text:"A new programming workshop has been added to the campus events list.",time:"Yesterday"},
  {type:"Event",title:"HackSRM registration",text:"Registration is available from the Events section.",time:"2 days ago"},
  {type:"Community",title:"New Team Finder posts",text:"Students are looking for teammates across development, design and content.",time:"2 days ago"}
];

function load(key,fallback){
  try{var raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback;}
  catch(e){return fallback;}
}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}}
var data=load(DATA_KEY,seed);
var teams=load(TEAM_KEY,teamSeed);

function currentUser(){
  try{return JSON.parse(localStorage.getItem(KEY));}
  catch(e){return null;}
}
function setUser(u){try{localStorage.setItem(KEY,JSON.stringify(u));}catch(e){}}
function initials(name){
  return (name||"Student").split(" ").map(function(x){return x.charAt(0);}).join("").slice(0,2).toUpperCase();
}
function toast(message){
  var t=document.querySelector(".toast");
  if(!t)return;
  t.textContent=message;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2200);
}
function go(page){location.hash=page;}

function loginPage(){
  document.getElementById("app").innerHTML=
    '<div class="login-shell">'+
      '<section class="login-brand">'+
        '<div class="logo"><span class="logo-mark">CC</span> Campus Connect</div>'+
        '<h1>Your campus.<br>Your community.<br>Your connect.</h1>'+
        '<p>Find campus events, discover clubs, meet students and find teammates without jumping between different groups.</p>'+
        '<div class="feature-list"><div>✓ Discover campus events</div><div>✓ Find project teammates</div><div>✓ Join clubs & communities</div><div>✓ Share ideas and opinions</div></div>'+
      '</section>'+
      '<section class="login-panel"><div class="login-box">'+
        '<h2 id="authTitle">Welcome back 👋</h2>'+
        '<p id="authSub">Sign in to continue to Campus Connect.</p>'+
        '<div class="auth-tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create account</button></div>'+
        '<form id="authForm">'+
          '<div id="signupFields"></div>'+
          '<div class="form-group"><label>SRM Email</label><input id="email" type="email" placeholder="you@srmuniv.edu.in" required></div>'+
          '<div class="form-group"><label>Password</label><input id="password" type="password" placeholder="••••••••" minlength="6" required></div>'+
          '<button class="btn btn-primary" style="width:100%" type="submit">Continue</button>'+
        '</form>'+
        '<div class="auth-note">Zeroth Review prototype: account data is stored locally in this browser. Backend authentication will be added in the next review.</div>'+
      '</div></section>'+
    '</div>';

  var mode="login";
  function renderAuth(){
    var signup=mode==="signup";
    document.getElementById("loginTab").classList.toggle("active",!signup);
    document.getElementById("signupTab").classList.toggle("active",signup);
    document.getElementById("authTitle").textContent=signup?"Join Campus Connect 🎓":"Welcome back 👋";
    document.getElementById("authSub").textContent=signup?"Create your student profile and join the campus community.":"Sign in to continue to Campus Connect.";
    document.getElementById("signupFields").innerHTML=signup?
      '<div class="form-group"><label>Full Name</label><input id="name" placeholder="Your name" required></div>'+
      '<div class="form-grid"><div class="form-group"><label>Department</label><select id="dept"><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>Biotech</option><option>Other</option></select></div>'+
      '<div class="form-group"><label>Year</label><select id="year"><option>1st Year</option><option selected>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div></div>':'';
  }
  document.getElementById("loginTab").onclick=function(){mode="login";renderAuth();};
  document.getElementById("signupTab").onclick=function(){mode="signup";renderAuth();};
  document.getElementById("authForm").onsubmit=function(e){
    e.preventDefault();
    var email=document.getElementById("email").value.trim();
    var signup=mode==="signup";
    var name=signup?document.getElementById("name").value.trim():email.split("@")[0].replace(/[._]/g," ");
    var u={
      name:name.replace(/\b\w/g,function(c){return c.toUpperCase();}),
      email:email,
      dept:signup?document.getElementById("dept").value:"CSE",
      year:signup?document.getElementById("year").value:"2nd Year",
      avatar:initials(name)
    };
    setUser(u);
    if(!data.students.some(function(s){return s.name===u.name;})){
      data.students.unshift({name:u.name,dept:u.dept,year:u.year,skills:["JavaScript"],interests:["Campus Life"],avatar:u.avatar});
      save(DATA_KEY,data);
    }
    location.hash="dashboard";
    render();
  };
  renderAuth();
}

function nav(active){
  var u=currentUser();
  var links=[
    ["dashboard","Home"],["events","Events"],["clubs","Clubs"],
    ["community","Community"],["students","Students"],
    ["notices","Notices"],["teamfinder","Team Finder"]
  ];
  var linkHtml=links.map(function(item){
    return '<button class="'+(active===item[0]?"active":"")+'" data-go="'+item[0]+'">'+item[1]+'</button>';
  }).join("");
  return '<nav class="nav"><div class="logo"><span class="logo-mark">CC</span> Campus Connect</div>'+
    '<div class="nav-links">'+linkHtml+'</div>'+
    '<div class="nav-user"><button class="icon-btn" data-go="notifications">🔔</button><button class="avatar" data-go="profile">'+initials(u&&u.name)+'</button><span>'+((u&&u.name)||"Student")+'</span></div></nav>'+
    '<div class="mobile-nav"><button data-go="dashboard">⌂<br>Home</button><button data-go="events">📅<br>Events</button><button data-go="teamfinder">🤝<br>Teams</button><button data-go="students">👥<br>Students</button><button data-go="profile">👤<br>Profile</button></div>';
}

function layout(content,active){
  document.getElementById("app").innerHTML='<div class="app">'+nav(active)+'<main class="main">'+content+'</main><div class="toast"></div></div>';
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-go"));};});
}

function stat(icon,num,label){
  return '<div class="card stat"><div><p>'+label+'</p><h3>'+num+'</h3></div><div class="stat-icon">'+icon+'</div></div>';
}

function eventCard(e){
  return '<article class="card event-card"><div class="event-cover '+(e.type||"")+'"><span class="tag" style="background:#ffffff2b;color:#fff">'+e.category+'</span><span>📅</span></div>'+
    '<div class="event-body"><h3>'+e.title+'</h3><div class="event-meta">📅 '+e.date+' · '+e.time+'<br>📍 '+e.place+'<br>👥 '+e.members+' registered</div>'+
    '<p class="muted" style="font-size:13px;margin-top:8px">'+e.desc+'</p><div class="event-actions"><button class="btn btn-light" data-event="'+e.id+'">Details</button><button class="btn btn-primary" data-register="'+e.id+'">Register</button></div></div></article>';
}

function dashboard(){
  layout('<section class="hero"><div><span class="tag" style="background:#ffffff2b;color:#fff">SRM STUDENT COMMUNITY</span><h1>Everything happening at SRM, in one place.</h1><p>Find events, clubs, campus notices and students to collaborate with — without jumping between different groups.</p><button class="btn btn-primary" style="background:#fff;color:#174ea6" data-go="events">Explore events →</button></div><div class="hero-badge"><b>2.4K+</b>students connected</div></section>'+
    '<div class="grid grid-4">'+stat("📅","86","Events this month")+stat("🏛️","24","Active clubs")+stat("👥","2,431","Students")+stat("🤝",teams.length,"Team Finder posts")+'</div>'+
    '<div class="section-head"><h2>What is new?</h2><button class="btn btn-light" data-go="notices">View notice board</button></div>'+
    '<div class="grid grid-3"><article class="card"><span class="tag">Campus notices</span><h3 style="margin:10px 0">Important updates in one place</h3><p class="muted">Academic, event, club and community updates are grouped together.</p></article>'+
    '<article class="card"><span class="tag">Team Finder</span><h3 style="margin:10px 0">Find people for your project</h3><p class="muted">Post the skills you need and let other students request to join.</p></article>'+
    '<article class="card"><span class="tag">Student Connect</span><h3 style="margin:10px 0">Connect beyond your class</h3><p class="muted">Search students by skills and interests.</p></article></div>'+
    '<div class="section-head"><h2>Upcoming events</h2><button class="btn btn-light" data-go="events">View all</button></div>'+
    '<div class="grid grid-3">'+data.events.slice(0,3).map(eventCard).join("")+'</div>'+
    '<div class="section-head"><h2>Community conversations</h2><button class="btn btn-light" data-go="community">Open community</button></div>'+
    '<div class="grid grid-2">'+data.posts.slice(0,2).map(postCard).join("")+'</div>',"dashboard");
  bindInteractions();
}

function events(){
  layout('<div class="page-title"><div><h1>Events</h1><p>Find what is happening around campus.</p></div><button class="btn btn-primary" id="createEvent">＋ Create event</button></div>'+
    '<div class="searchbar"><input id="eventSearch" placeholder="Search events..."><select id="eventFilter"><option value="">All categories</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option></select></div>'+
    '<div id="eventGrid" class="grid grid-3">'+data.events.map(eventCard).join("")+'</div>',"events");
  document.getElementById("createEvent").onclick=addEvent;
  document.getElementById("eventSearch").oninput=filterEvents;
  document.getElementById("eventFilter").onchange=filterEvents;
  bindInteractions();
}
function filterEvents(){
  var q=document.getElementById("eventSearch").value.toLowerCase();
  var f=document.getElementById("eventFilter").value;
  var list=data.events.filter(function(e){return (e.title+" "+e.desc+" "+e.place).toLowerCase().indexOf(q)>=0 && (!f||e.category===f);});
  document.getElementById("eventGrid").innerHTML=list.length?list.map(eventCard).join(""):'<div class="card" style="grid-column:1/-1;text-align:center;padding:40px;color:#667085">No events found.</div>';
  bindInteractions();
}

function clubs(){
  layout('<div class="page-title"><div><h1>Clubs & Communities</h1><p>Find people who share your interests.</p></div></div>'+
    '<div class="grid grid-2">'+data.clubs.map(function(c){
      return '<article class="card"><div class="club-icon">'+c.icon+'</div><h3>'+c.name+'</h3><p class="muted">'+c.about+'</p><div class="pill-row">'+c.tags.map(function(t){return '<span class="pill">'+t+'</span>';}).join("")+'</div><div class="member-row"><span>👥 '+c.members+' members</span><button class="btn btn-primary" data-join="'+c.name+'">Join club</button></div></article>';
    }).join("")+'</div>',"clubs");
  document.querySelectorAll("[data-join]").forEach(function(b){b.onclick=function(){toast("Request sent to join "+b.getAttribute("data-join")+"!");};});
}

function postCard(p){
  return '<article class="card" style="margin-bottom:15px"><div class="post"><div class="avatar">'+p.avatar+'</div><div class="post-content"><div class="post-head"><div><span class="post-name">'+p.name+'</span><div class="muted" style="font-size:12px">'+p.year+' · '+p.tag+'</div></div></div><p class="post-text">'+p.text+'</p><div class="post-actions"><button data-like="'+p.id+'">♡ '+p.likes+' Likes</button><button data-comment="'+p.id+'">💬 '+p.comments+' Comments</button><button data-save="'+p.id+'">🔖 Save</button></div></div></div></article>';
}
function community(){
  layout('<div class="page-title"><div><h1>Community</h1><p>Share ideas, ask questions and hear from fellow students.</p></div><button class="btn btn-primary" id="newPost">＋ Create post</button></div>'+
    '<div class="grid grid-2"><div>'+data.posts.map(postCard).join("")+'</div><aside class="card"><h3>Campus poll 🗳️</h3><p style="margin:10px 0">What should students get more of this semester?</p>'+
    ["Technical workshops","Cultural events","Sports activities","Project meetups"].map(function(x,i){return '<button class="btn btn-light" style="display:block;width:100%;text-align:left;margin:8px 0" data-vote="'+x+'">'+x+'<span style="float:right">'+[42,28,18,12][i]+'%</span></button>';}).join("")+
    '</aside></div>',"community");
  document.getElementById("newPost").onclick=newPost;
  document.querySelectorAll("[data-like]").forEach(function(b){b.onclick=function(){var p=data.posts.find(function(x){return x.id===Number(b.getAttribute("data-like"));});if(p){p.likes++;save(DATA_KEY,data);community();toast("Liked!");}};});
  document.querySelectorAll("[data-comment]").forEach(function(b){b.onclick=function(){toast("Comments will be connected to the backend in the next review.");};});
  document.querySelectorAll("[data-save]").forEach(function(b){b.onclick=function(){toast("Post saved!");};});
  document.querySelectorAll("[data-vote]").forEach(function(b){b.onclick=function(){toast("Vote recorded for "+b.getAttribute("data-vote")+"!");};});
}

function students(){
  layout('<div class="page-title"><div><h1>Student Connect</h1><p>Find classmates, project partners and people with shared interests.</p></div></div><div class="searchbar"><input id="studentSearch" placeholder="Search by name, skill or interest..."></div><div id="studentGrid" class="grid grid-3">'+studentCards(data.students).join("")+'</div>',"students");
  document.getElementById("studentSearch").oninput=filterStudents;
  bindConnect();
}
function studentCards(arr){
  return arr.map(function(s){return '<article class="card"><div style="display:flex;gap:13px;align-items:center"><div class="avatar">'+(s.avatar||initials(s.name))+'</div><div><h3>'+s.name+'</h3><p class="muted">'+s.dept+' • '+s.year+'</p></div></div><div class="pill-row">'+(s.skills||[]).map(function(x){return '<span class="pill">'+x+'</span>';}).join("")+'</div><p class="muted" style="margin-top:12px">Interests: '+(s.interests||[]).join(" · ")+'</p><button class="btn btn-primary" style="width:100%;margin-top:15px" data-connect="'+s.name+'">Connect</button></article>';});
}
function filterStudents(){
  var q=document.getElementById("studentSearch").value.toLowerCase();
  var list=data.students.filter(function(s){return JSON.stringify(s).toLowerCase().indexOf(q)>=0;});
  document.getElementById("studentGrid").innerHTML=list.length?studentCards(list).join(""):'<div class="card" style="grid-column:1/-1;text-align:center;padding:40px;color:#667085">No students found.</div>';
  bindConnect();
}
function bindConnect(){document.querySelectorAll("[data-connect]").forEach(function(b){b.onclick=function(){toast("Connection request sent to "+b.getAttribute("data-connect")+"!");};});}

function noticesPage(){
  layout('<div class="page-title"><div><h1>Campus Notice Board</h1><p>One place for important student-facing updates.</p></div></div>'+
    '<div class="card"><span class="tag">Campus Connect idea</span><p style="margin-top:8px">Important information should be easier to find than scrolling through separate club and class groups.</p></div>'+
    '<div class="grid grid-2" style="margin-top:18px"><div class="card"><h3>Latest notices</h3>'+
    notices.map(function(n){return '<div class="notice"><div class="notice-icon">'+(n.type==="Academic"?"📚":n.type==="Club"?"🏛️":n.type==="Event"?"📅":"💬")+'</div><div><span class="tag">'+n.type+'</span><h3 style="font-size:16px;margin-top:7px">'+n.title+'</h3><p class="muted" style="margin-top:4px;line-height:1.5">'+n.text+'</p><small class="muted">'+n.time+'</small></div></div>';}).join("")+
    '</div><aside class="card"><h3>Campus snapshot</h3>'+statLine("Upcoming events",data.events.length)+statLine("Student clubs",data.clubs.length)+statLine("Team Finder posts",teams.length)+statLine("Community posts",data.posts.length)+'</aside></div>',"notices");
}
function statLine(label,value){return '<div style="display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)"><span>'+label+'</span><b>'+value+'</b></div>';}

function teamFinder(){
  layout('<div class="page-title"><div><h1>Team Finder</h1><p>Find students for projects, hackathons and campus activities.</p></div><button class="btn btn-primary" id="newTeam">＋ Find teammates</button></div>'+
    '<div class="card" style="margin-bottom:18px"><span class="tag">Why this feature?</span><p style="margin-top:7px">Students can describe what they are building and the skills they need instead of searching through multiple chats.</p></div>'+
    '<div class="filters"><button class="active" data-team-filter="All">All</button><button data-team-filter="Academic">Academic</button><button data-team-filter="Hackathon">Hackathon</button><button data-team-filter="Creative">Creative</button></div>'+
    '<div id="teamGrid" class="grid grid-2">'+teams.map(teamCard).join("")+'</div>',"teamfinder");
  document.getElementById("newTeam").onclick=newTeamPost;
  document.querySelectorAll("[data-team-filter]").forEach(function(b){b.onclick=function(){filterTeams(b.getAttribute("data-team-filter"));};});
  bindTeamJoin();
}
function teamCard(t){
  return '<article class="card team-card"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="tag">'+t.type+'</span><h3 style="margin-top:9px">'+t.title+'</h3></div><div class="avatar">'+initials(t.owner)+'</div></div><p class="muted" style="margin-top:8px">'+t.desc+'</p><div class="team-meta"><span>Owner: '+t.owner+'</span><span>'+t.dept+' · '+t.year+'</span></div><b style="font-size:13px">Already have:</b><div class="pill-row">'+t.skills.map(function(x){return '<span class="pill">'+x+'</span>';}).join("")+'</div><b style="font-size:13px;display:block;margin-top:12px">Looking for:</b><div class="pill-row">'+t.need.map(function(x){return '<span class="pill">'+x+'</span>';}).join("")+'</div><button class="btn btn-primary" style="width:100%;margin-top:16px" data-team-join="'+t.title+'">Request to join</button></article>';
}
function filterTeams(type){
  document.querySelectorAll("[data-team-filter]").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-team-filter")===type);});
  var list=type==="All"?teams:teams.filter(function(t){return t.type===type;});
  document.getElementById("teamGrid").innerHTML=list.length?list.map(teamCard).join(""):'<div class="card" style="grid-column:1/-1;text-align:center;padding:40px;color:#667085">No team posts in this category.</div>';
  bindTeamJoin();
}
function bindTeamJoin(){document.querySelectorAll("[data-team-join]").forEach(function(b){b.onclick=function(){toast("Join request sent for "+b.getAttribute("data-team-join")+"!");};});}
function newTeamPost(){
  openModal("Find teammates",'<form id="teamForm"><div class="form-group"><label>Project / team title</label><input id="tfTitle" required placeholder="e.g. Smart Campus Web App"></div><div class="form-grid"><div class="form-group"><label>Type</label><select id="tfType"><option>Academic</option><option>Hackathon</option><option>Creative</option></select></div><div class="form-group"><label>Skills needed</label><input id="tfNeed" required placeholder="Backend, UI/UX"></div></div><div class="form-group"><label>Description</label><textarea id="tfDesc" required placeholder="Explain what you are building and who you need."></textarea></div><button class="btn btn-primary" style="width:100%" type="submit">Post to Team Finder</button></form>');
  document.getElementById("teamForm").onsubmit=function(e){
    e.preventDefault();var u=currentUser();
    teams.unshift({id:Date.now(),title:document.getElementById("tfTitle").value,owner:u.name,dept:u.dept,year:u.year,skills:["Student project"],need:document.getElementById("tfNeed").value.split(",").map(function(x){return x.trim();}).filter(Boolean),type:document.getElementById("tfType").value,desc:document.getElementById("tfDesc").value});
    save(TEAM_KEY,teams);closeModal();teamFinder();toast("Team post created!");
  };
}

function profile(){
  var u=currentUser();
  layout('<div class="card" style="padding:0;overflow:hidden"><div class="profile-cover"></div><div class="profile-info"><div class="avatar profile-avatar">'+initials(u.name)+'</div><h2 style="margin-top:10px">'+u.name+'</h2><p class="muted" style="margin-top:4px">'+u.dept+' • '+u.year+' · '+u.email+'</p><div class="pill-row"><span class="pill">JavaScript</span><span class="pill">Python</span><span class="pill">Campus Life</span></div><div style="display:flex;gap:9px;margin-top:20px"><button class="btn btn-primary" id="editProfile">Edit profile</button><button class="btn btn-light" id="logout">Log out</button></div></div></div>'+
    '<div class="grid grid-3" style="margin-top:18px">'+stat("👥","24","Connections")+stat("📅","7","Events attended")+stat("💬","12","Posts")+'</div>',"profile");
  document.getElementById("logout").onclick=function(){try{localStorage.removeItem(KEY);}catch(e){}location.hash="login";render();};
  document.getElementById("editProfile").onclick=editProfile;
}
function editProfile(){
  var u=currentUser();
  openModal("Edit profile",'<form id="profileForm"><div class="form-group"><label>Name</label><input id="editName" required value="'+u.name+'"></div><div class="form-group"><label>Department</label><input id="editDept" required value="'+u.dept+'"></div><div class="form-group"><label>Year</label><select id="editYear">'+["1st Year","2nd Year","3rd Year","4th Year"].map(function(y){return '<option '+(u.year===y?"selected":"")+'>'+y+'</option>';}).join("")+'</select></div><button class="btn btn-primary" style="width:100%">Save changes</button></form>');
  document.getElementById("profileForm").onsubmit=function(e){e.preventDefault();u.name=document.getElementById("editName").value;u.dept=document.getElementById("editDept").value;u.year=document.getElementById("editYear").value;u.avatar=initials(u.name);setUser(u);closeModal();profile();toast("Profile updated!");};
}

function notifications(){
  layout('<div class="page-title"><div><h1>Notifications</h1><p>Stay updated with your campus activity.</p></div></div><div class="card">'+
    [["📅","HackSRM 2026","Registration is open."],["🏛️","Coding Club","New workshop announced."],["💬","Community","Someone replied to a discussion."],["👥","Student Connect","You have a new connection request."]].map(function(n){return '<div class="notice"><div class="notice-icon">'+n[0]+'</div><div><b>'+n[1]+'</b><p class="muted" style="margin-top:4px">'+n[2]+'</p></div></div>';}).join("")+
    '</div>',"");
}

function openModal(title,body){
  var old=document.getElementById("modalBg");if(old)old.remove();
  var div=document.createElement("div");div.id="modalBg";div.className="modal-bg";
  div.innerHTML='<div class="modal"><div class="modal-head"><h2>'+title+'</h2><button class="close" id="closeModal">✕</button></div>'+body+'</div>';
  document.body.appendChild(div);
  document.getElementById("closeModal").onclick=closeModal;
}
function closeModal(){var m=document.getElementById("modalBg");if(m)m.remove();}

function addEvent(){
  openModal("Create campus event",'<form id="eventForm"><div class="form-grid"><div class="form-group"><label>Event title</label><input id="evTitle" required></div><div class="form-group"><label>Category</label><select id="evCat"><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option></select></div><div class="form-group"><label>Date</label><input id="evDate" placeholder="25 Sep 2026" required></div><div class="form-group"><label>Time</label><input id="evTime" placeholder="10:00 AM" required></div><div class="form-group full"><label>Venue</label><input id="evPlace" required placeholder="Event location"></div><div class="form-group full"><label>Description</label><textarea id="evDesc" required></textarea></div></div><button class="btn btn-primary" style="width:100%">Create event</button></form>');
  document.getElementById("eventForm").onsubmit=function(e){
    e.preventDefault();data.events.unshift({id:Date.now(),title:document.getElementById("evTitle").value,category:document.getElementById("evCat").value,date:document.getElementById("evDate").value,time:document.getElementById("evTime").value,place:document.getElementById("evPlace").value,members:0,desc:document.getElementById("evDesc").value,type:document.getElementById("evCat").value.toLowerCase()});
    save(DATA_KEY,data);closeModal();events();toast("Event created!");
  };
}
function newPost(){
  openModal("Create a post",'<form id="postForm"><div class="form-group"><label>Topic</label><select id="postTag"><option>General</option><option>Campus Life</option><option>Events</option><option>Clubs</option><option>Team Finder</option><option>Academics</option></select></div><div class="form-group"><label>Your thoughts</label><textarea id="postText" required placeholder="What is on your mind?"></textarea></div><button class="btn btn-primary" style="width:100%">Publish post</button></form>');
  document.getElementById("postForm").onsubmit=function(e){
    e.preventDefault();var u=currentUser();data.posts.unshift({id:Date.now(),name:u.name,year:u.dept+" • "+u.year,avatar:initials(u.name),text:document.getElementById("postText").value,likes:0,comments:0,tag:document.getElementById("postTag").value});save(DATA_KEY,data);closeModal();community();toast("Post published!");
  };
}
function bindInteractions(){
  document.querySelectorAll("[data-event]").forEach(function(b){b.onclick=function(){var e=data.events.find(function(x){return x.id===Number(b.getAttribute("data-event"));});if(e)openModal(e.title,'<span class="tag">'+e.category+'</span><p style="margin:15px 0;line-height:1.7">'+e.desc+'</p><p class="muted">📅 '+e.date+' · '+e.time+'<br>📍 '+e.place+'<br>👥 '+e.members+' students registered</p><button class="btn btn-primary" style="margin-top:18px;width:100%" data-register-modal="'+e.id+'">Register</button>');};});
  document.querySelectorAll("[data-register]").forEach(function(b){b.onclick=function(){registerEvent(Number(b.getAttribute("data-register")));};});
}
function registerEvent(id){var e=data.events.find(function(x){return x.id===id;});if(e){e.members++;save(DATA_KEY,data);toast("You are registered for "+e.title+"!");}}
function bindModalRegister(){
  document.querySelectorAll("[data-register-modal]").forEach(function(b){b.onclick=function(){registerEvent(Number(b.getAttribute("data-register-modal")));closeModal();};});
}

function render(){
  var u=currentUser();
  if(!u){loginPage();return;}
  var page=location.hash.replace("#","")||"dashboard";
  var pages={dashboard:dashboard,events:events,clubs:clubs,community:community,students:students,profile:profile,notifications:notifications,notices:noticesPage,teamfinder:teamFinder};
  (pages[page]||dashboard)();
}
window.addEventListener("hashchange",render);
render();
})();
</script>
</body>
</html>
