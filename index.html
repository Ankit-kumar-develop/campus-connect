<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Connect — SRM Community</title><style>:root{
  --bg:#f6f7fb; --card:#fff; --text:#172033; --muted:#6b7280;
  --primary:#5b5ce2; --primary2:#7c3aed; --border:#e7e8f0;
  --success:#16a34a; --danger:#dc2626; --shadow:0 12px 35px rgba(27,31,61,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{text-decoration:none;color:inherit}
.app{min-height:100vh}
.nav{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:24px;padding:0 5%;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:21px;display:flex;align-items:center;gap:9px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center}
.nav-links{display:flex;gap:6px;flex:1}
.nav-links button,.mobile-nav button{background:transparent;padding:10px 13px;border-radius:10px;color:var(--muted)}
.nav-links button.active,.nav-links button:hover,.mobile-nav button.active{background:#f0efff;color:var(--primary);font-weight:700}
.nav-user{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:800}
.icon-btn{background:#f5f5fa;width:38px;height:38px;border-radius:11px}
.main{max-width:1250px;margin:auto;padding:30px 5% 90px}
.page-title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
.page-title h1{font-size:32px;letter-spacing:-1px}
.page-title p{color:var(--muted);margin-top:6px}
.btn{padding:11px 16px;border-radius:11px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#4c4dcc}
.btn-light{background:#f0f1f7;color:var(--text)}
.btn-danger{background:#fee2e2;color:#b91c1c}
.grid{display:grid;gap:18px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;justify-content:space-between}
.stat h3{font-size:27px;margin-top:5px}
.stat p{color:var(--muted);font-size:13px}
.stat-icon{width:45px;height:45px;border-radius:13px;background:#f0efff;display:grid;place-items:center;font-size:21px}
.hero{background:linear-gradient(120deg,#1d1e48,#5146c9);color:#fff;border-radius:24px;padding:32px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:25px;overflow:hidden}
.hero h1{font-size:35px;max-width:650px}
.hero p{color:#dddfff;margin:10px 0 20px;max-width:600px;line-height:1.6}
.hero-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:14px 18px;border-radius:16px;text-align:center;min-width:150px}
.hero-badge b{font-size:30px;display:block}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}
.section-head h2{font-size:20px}
.muted{color:var(--muted)}
.event-card{overflow:hidden;padding:0}
.event-cover{height:125px;background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:17px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start}
.event-cover.tech{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.event-cover.culture{background:linear-gradient(135deg,#be185d,#ec4899)}
.event-cover.sports{background:linear-gradient(135deg,#b45309,#f59e0b)}
.event-body{padding:18px}
.tag{display:inline-flex;background:#f0efff;color:var(--primary);font-size:12px;padding:5px 8px;border-radius:7px;font-weight:700}
.event-body h3{margin:10px 0 8px}
.event-meta{color:var(--muted);font-size:13px;line-height:1.9}
.event-actions{display:flex;gap:8px;margin-top:13px}
.event-actions .btn{flex:1}
.post{display:flex;gap:13px}
.post-content{flex:1}
.post-head{display:flex;justify-content:space-between;gap:10px}
.post-name{font-weight:800}
.post-text{margin:9px 0 13px;line-height:1.5}
.post-actions{display:flex;gap:18px;color:var(--muted);font-size:13px}
.post-actions button{background:transparent;color:inherit}
.club-card h3{margin:12px 0 7px}
.club-icon{width:54px;height:54px;border-radius:15px;background:#f0efff;display:grid;place-items:center;font-size:25px}
.member-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:var(--muted);font-size:13px}
.searchbar{display:flex;gap:10px;margin-bottom:18px}
.searchbar input{flex:1}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:11px;outline:none;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5b5ce21a}
textarea{min-height:100px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.full{grid-column:1/-1}
.modal-backdrop{position:fixed;inset:0;background:rgba(13,16,35,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-backdrop.show{display:flex}
.modal{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:25px}
.modal-head{display:flex;justify-content:space-between;margin-bottom:18px}
.close{background:#f3f4f6;width:35px;height:35px;border-radius:9px}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:100}
.toast.show{display:block}
.mobile-nav{display:none}
.login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.login-brand{background:linear-gradient(145deg,#181943,#5547d7);color:#fff;padding:8%;display:flex;flex-direction:column;justify-content:center}
.login-brand h1{font-size:52px;line-height:1.05;max-width:600px}
.login-brand p{color:#dddfff;line-height:1.7;margin:18px 0 30px;max-width:550px}
.feature-list{display:grid;gap:12px}.feature-list div{display:flex;gap:10px;align-items:center}
.login-panel{background:#fff;display:flex;align-items:center;justify-content:center;padding:8%}
.login-box{width:min(430px,100%)}.login-box h2{font-size:30px}.login-box>p{color:var(--muted);margin:8px 0 25px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f4f8;padding:4px;border-radius:10px;margin-bottom:20px}
.auth-tabs button{padding:10px;border-radius:8px;background:transparent;color:var(--muted)}.auth-tabs button.active{background:#fff;color:var(--primary);font-weight:800}
.auth-note{font-size:12px;color:var(--muted);background:#f7f7fb;padding:11px;border-radius:10px;margin-top:15px}
.profile-cover{height:160px;border-radius:20px;background:linear-gradient(120deg,#312e81,#7c3aed);position:relative}
.profile-info{margin-top:-38px;padding:0 25px 25px}.profile-avatar{width:86px;height:86px;border:5px solid #fff;font-size:28px}
.profile-name{font-size:25px;font-weight:900;margin-top:10px}
.pill-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{padding:6px 9px;background:#f0efff;color:var(--primary);border-radius:20px;font-size:12px;font-weight:700}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--border);font-size:14px}.table th{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}.nav-links{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:7px}.mobile-nav button{font-size:11px}.main{padding-bottom:90px}.login-shell{grid-template-columns:1fr}.login-brand{display:none}}
@media(max-width:600px){.grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:28px}.hero-badge{display:none}.page-title{align-items:flex-start;flex-direction:column}.nav{padding:0 4%}.nav-user .user-name{display:none}.main{padding:22px 4% 90px}}
</style></head><body><div id="app"></div>
<script>const KEY="campusConnectUser";
const DATA_KEY="campusConnectData";

const seed={
  events:[
    {id:1,title:"HackSRM 2026",category:"Technical",date:"25 Sep 2026",time:"10:00 AM",place:"Tech Park",members:128,desc:"Build, collaborate and solve real-world problems in a 24-hour campus hackathon.",type:"tech"},
    {id:2,title:"Cultural Night",category:"Cultural",date:"27 Sep 2026",time:"6:00 PM",place:"Dr. T. P. Ganesan Auditorium",members:342,desc:"Music, dance and performances from students across the campus.",type:"culture"},
    {id:3,title:"Inter-Department Football",category:"Sports",date:"30 Sep 2026",time:"4:00 PM",place:"University Ground",members:96,desc:"Represent your department and compete for the campus championship.",type:"sports"},
    {id:4,title:"AI & Future of Work",category:"Workshop",date:"03 Oct 2026",time:"11:00 AM",place:"Seminar Hall 2",members:74,desc:"An interactive session on AI, careers and the future of technology.",type:"tech"}
  ],
  clubs:[
    {id:1,name:"Coding Club",icon:"💻",members:356,about:"Programming, hackathons, competitive coding and developer communities.",tags:["Coding","Hackathons","DSA"]},
    {id:2,name:"Photography Club",icon:"📸",members:214,about:"Capture campus life, learn photography and work on creative projects.",tags:["Photography","Editing","Creative"]},
    {id:3,name:"E-Cell SRM",icon:"🚀",members:481,about:"Entrepreneurship, startup ideas, pitching and innovation.",tags:["Startups","Business","Innovation"]},
    {id:4,name:"Music Club",icon:"🎵",members:188,about:"For singers, musicians, producers and anyone who loves music.",tags:["Music","Performance","Beats"]}
  ],
  posts:[
    {id:1,name:"Rahul Sharma",year:"CSE • 3rd Year",avatar:"RS",text:"Anyone interested in forming a team for HackSRM? Looking for a frontend developer and an ML person.",likes:31,comments:8,tag:"Team Finder"},
    {id:2,name:"Priya Nair",year:"ECE • 2nd Year",avatar:"PN",text:"What do you guys think about extending library timings during exam week?",likes:56,comments:19,tag:"Campus Life"},
    {id:3,name:"Arjun K",year:"CSE • 2nd Year",avatar:"AK",text:"Photography Club is conducting a street photography walk this weekend. Who's joining?",likes:22,comments:4,tag:"Clubs"}
  ],
  students:[
    {name:"Ankit Kumar",dept:"CSE",year:"2nd Year",skills:["JavaScript","Python","C++"],interests:["AI","Photography"],avatar:"AK"},
    {name:"Rahul Sharma",dept:"CSE",year:"3rd Year",skills:["React","Node.js","Python"],interests:["Hackathons","AI"],avatar:"RS"},
    {name:"Priya Nair",dept:"ECE",year:"2nd Year",skills:["Java","IoT","C"],interests:["Robotics","Music"],avatar:"PN"},
    {name:"Aarav Menon",dept:"CSE",year:"2nd Year",skills:["Figma","UI/UX","JavaScript"],interests:["Design","Startups"],avatar:"AM"}
  ]
};

function loadData(){try{return JSON.parse(localStorage.getItem(DATA_KEY))||seed}catch{return seed}}
function saveData(d){localStorage.setItem(DATA_KEY,JSON.stringify(d))}
let data=loadData();

function user(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function initials(name){return (name||"Student").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function toast(msg){const t=document.querySelector(".toast"); if(!t)return; t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function nav(active){
  const u=user(); return `<nav class="nav">
    <a class="logo" href="#dashboard"><span class="logo-mark">CC</span> Campus Connect</a>
    <div class="nav-links">
      ${["dashboard","events","clubs","community","students"].map(x=>`<button class="${active===x?"active":""}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}
    </div>
    <div class="nav-user">
      <button class="icon-btn" onclick="go('notifications')">🔔</button>
      <button class="avatar" onclick="go('profile')">${initials(u?.name)}</button>
      <span class="user-name">${u?.name||"Student"}</span>
    </div>
  </nav>
  <div class="mobile-nav">
    <button class="${active==="dashboard"?"active":""}" onclick="go('dashboard')">⌂<br>Home</button>
    <button class="${active==="events"?"active":""}" onclick="go('events')">📅<br>Events</button>
    <button class="${active==="community"?"active":""}" onclick="go('community')">💬<br>Community</button>
    <button class="${active==="students"?"active":""}" onclick="go('students')">👥<br>Students</button>
    <button onclick="go('profile')">👤<br>Profile</button>
  </div>`
}
function layout(content,active){
 document.getElementById("app").innerHTML=`<div class="app">${nav(active)}<main class="main">${content}</main><div class="toast"></div></div>`;
}
function go(page){location.hash=page}
function modal(title,body){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-backdrop show" id="modal"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}</div></div>`)
}
function closeModal(){document.getElementById("modal")?.remove()}

function loginPage(){
 document.getElementById("app").innerHTML=`<div class="login-shell">
 <section class="login-brand">
   <div class="logo"><span class="logo-mark">CC</span> Campus Connect</div>
   <h1>Your campus.<br>Your community.<br>Your connect.</h1>
   <p>Discover events, join clubs, meet students, find project teammates and make your voice heard — all in one campus community.</p>
   <div class="feature-list">
    <div>✓ Discover campus events</div><div>✓ Connect with students</div><div>✓ Join clubs & communities</div><div>✓ Share ideas and opinions</div>
   </div>
 </section>
 <section class="login-panel"><div class="login-box">
   <h2 id="authTitle">Welcome back 👋</h2><p id="authSub">Sign in to continue to Campus Connect.</p>
   <div class="auth-tabs"><button id="loginTab" class="active" onclick="showAuth('login')">Login</button><button id="signupTab" onclick="showAuth('signup')">Create account</button></div>
   <form id="authForm" onsubmit="handleAuth(event)">
     <div id="signupFields"></div>
     <div class="form-group"><label>SRM Email</label><input id="email" type="email" placeholder="you@srmuniv.edu.in" required></div>
     <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="••••••••" required minlength="6"></div>
     <button class="btn btn-primary" style="width:100%">Continue</button>
   </form>
   <div class="auth-note">Demo mode: your account is stored locally in this browser. No real SRM credentials are required.</div>
 </div></section></div>`
}
function showAuth(mode){
 document.getElementById("loginTab").classList.toggle("active",mode==="login");
 document.getElementById("signupTab").classList.toggle("active",mode==="signup");
 document.getElementById("authTitle").textContent=mode==="login"?"Welcome back 👋":"Join Campus Connect 🎓";
 document.getElementById("authSub").textContent=mode==="login"?"Sign in to continue to Campus Connect.":"Create your student profile and join the campus community.";
 document.getElementById("signupFields").innerHTML=mode==="signup"?`<div class="form-group"><label>Full Name</label><input id="name" placeholder="Your name" required></div><div class="form-grid"><div class="form-group"><label>Department</label><select id="dept"><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>Biotech</option><option>Other</option></select></div><div class="form-group"><label>Year</label><select id="year"><option>1st Year</option><option selected>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div></div>`:"";
}
function handleAuth(e){
 e.preventDefault();
 const signup=!!document.getElementById("name");
 const email=document.getElementById("email").value.trim();
 const name=signup?document.getElementById("name").value.trim():email.split("@")[0].replace(/[._]/g," ");
 const u={name:name.replace(/\b\w/g,c=>c.toUpperCase()),email,dept:signup?document.getElementById("dept").value:"CSE",year:signup?document.getElementById("year").value:"2nd Year",avatar:initials(name)};
 localStorage.setItem(KEY,JSON.stringify(u)); if(!data.students.find(s=>s.name===u.name))data.students.unshift({...u,skills:["JavaScript"],interests:["Campus Life"]});saveData(data);location.hash="dashboard";
}

function dashboard(){
 const u=user();
 layout(`
 <section class="hero"><div><span class="tag" style="background:#ffffff1c;color:#fff">SRM CAMPUS COMMUNITY</span><h1>Everything happening on campus, in one place.</h1><p>Discover events, join clubs, meet people, find teammates and share what's on your mind.</p><button class="btn btn-primary" style="background:#fff;color:#4338ca" onclick="go('events')">Explore events →</button></div><div class="hero-badge"><b>2.4K+</b>students connected</div></section>
 <div class="grid grid-4">
  ${stat("📅","86","Events this month")}${stat("🏛️","24","Active clubs")}${stat("👥","2,431","Students")}${stat("💬","634","Community posts")}
 </div>
 <div class="section-head"><h2>Upcoming events</h2><button class="btn btn-light" onclick="go('events')">View all</button></div>
 <div class="grid grid-3">${data.events.slice(0,3).map(eventCard).join("")}</div>
 <div class="section-head"><h2>Trending in the community</h2><button class="btn btn-light" onclick="go('community')">Open community</button></div>
 <div class="grid grid-2">${data.posts.slice(0,2).map(postCard).join("")}</div>
 `,"dashboard");
}
function stat(icon,num,label){return `<div class="card stat"><div><p>${label}</p><h3>${num}</h3></div><div class="stat-icon">${icon}</div></div>`}
function eventCard(e){
 return `<article class="card event-card"><div class="event-cover ${e.type||""}"><span class="tag" style="background:#ffffff25;color:#fff">${e.category}</span><span>📅</span></div><div class="event-body"><h3>${e.title}</h3><div class="event-meta">📅 ${e.date} · ${e.time}<br>📍 ${e.place}<br>👥 ${e.members} registered</div><p class="muted" style="font-size:13px;margin-top:8px">${e.desc}</p><div class="event-actions"><button class="btn btn-light" onclick="eventDetails(${e.id})">Details</button><button class="btn btn-primary" onclick="registerEvent(${e.id})">Register</button></div></div></article>`
}
function events(){
 layout(`<div class="page-title"><div><h1>Events</h1><p>Find what's happening around campus.</p></div><button class="btn btn-primary" onclick="addEvent()">＋ Create event</button></div>
 <div class="searchbar"><input id="eventSearch" placeholder="Search events..." oninput="filterEvents()"><select id="eventFilter" onchange="filterEvents()"><option value="">All categories</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option></select></div>
 <div id="eventGrid" class="grid grid-3">${data.events.map(eventCard).join("")}</div>`,"events")
}
function filterEvents(){
 const q=document.getElementById("eventSearch").value.toLowerCase(), f=document.getElementById("eventFilter").value;
 document.getElementById("eventGrid").innerHTML=data.events.filter(e=>(e.title+e.desc+e.place).toLowerCase().includes(q)&&(!f||e.category===f)).map(eventCard).join("")||`<div class="card empty" style="grid-column:1/-1">No events found.</div>`
}
function eventDetails(id){const e=data.events.find(x=>x.id===id);modal(e.title,`<span class="tag">${e.category}</span><p style="margin:15px 0;line-height:1.7">${e.desc}</p><p class="muted">📅 ${e.date} · ${e.time}<br>📍 ${e.place}<br>👥 ${e.members} students registered</p><button class="btn btn-primary" style="margin-top:18px;width:100%" onclick="registerEvent(${id});closeModal()">Register for event</button>`)}
function registerEvent(id){const e=data.events.find(x=>x.id===id);if(e){e.members++;saveData(data);toast(`You're registered for ${e.title}!`)}}

function clubs(){
 layout(`<div class="page-title"><div><h1>Clubs & Communities</h1><p>Find people who share your interests.</p></div></div>
 <div class="grid grid-2">${data.clubs.map(c=>`<article class="card club-card"><div class="club-icon">${c.icon}</div><h3>${c.name}</h3><p class="muted">${c.about}</p><div class="pill-row">${c.tags.map(t=>`<span class="pill">${t}</span>`).join("")}</div><div class="member-row"><span>👥 ${c.members} members</span><button class="btn btn-primary" onclick="joinClub('${c.name}')">Join club</button></div></article>`).join("")}</div>`,"clubs")
}
function joinClub(name){toast(`Request sent to join ${name}.`)}

function community(){
 layout(`<div class="page-title"><div><h1>Community</h1><p>Share ideas, ask questions and hear from fellow students.</p></div><button class="btn btn-primary" onclick="newPost()">＋ Create post</button></div>
 <div class="grid grid-2"><div>${data.posts.map(postCard).join("")}</div><aside class="card"><h3>Campus poll 🗳️</h3><p style="margin:10px 0">What should students get more of this semester?</p>${["Technical workshops","Cultural events","Sports activities","Project meetups"].map((x,i)=>`<button onclick="vote('${x}')" style="display:block;width:100%;text-align:left;background:#f7f7fb;padding:12px;border-radius:10px;margin:8px 0">${x}<span style="float:right">${[42,28,18,12][i]}%</span></button>`).join("")}</aside></div>`,"community")
}
function postCard(p){
 return `<article class="card" style="margin-bottom:15px"><div class="post"><div class="avatar">${p.avatar}</div><div class="post-content"><div class="post-head"><div><span class="post-name">${p.name}</span><div class="muted" style="font-size:12px">${p.year} · ${p.tag}</div></div><button class="icon-btn">•••</button></div><p class="post-text">${p.text}</p><div class="post-actions"><button onclick="likePost(${p.id})">♡ ${p.likes} Likes</button><button onclick="toast('Comments coming soon!')">💬 ${p.comments} Comments</button><button onclick="toast('Post saved!')">🔖 Save</button></div></div></div></article>`
}
function likePost(id){const p=data.posts.find(x=>x.id===id);p.likes++;saveData(data);community();toast("Liked!")}

function newPost(){
 modal("Create a post",`<form onsubmit="createPost(event)"><div class="form-group"><label>Topic</label><select id="postTag"><option>General</option><option>Campus Life</option><option>Events</option><option>Clubs</option><option>Team Finder</option><option>Academics</option></select></div><div class="form-group"><label>Your thoughts</label><textarea id="postText" placeholder="What's on your mind?" required></textarea></div><button class="btn btn-primary" style="width:100%">Publish post</button></form>`)
}
function createPost(e){e.preventDefault();const u=user();data.posts.unshift({id:Date.now(),name:u.name,year:`${u.dept} • ${u.year}`,avatar:initials(u.name),text:document.getElementById("postText").value,likes:0,comments:0,tag:document.getElementById("postTag").value});saveData(data);closeModal();community();toast("Post published!")}

function students(){
 layout(`<div class="page-title"><div><h1>Student Connect</h1><p>Find classmates, project partners and people with shared interests.</p></div></div>
 <div class="searchbar"><input id="studentSearch" placeholder="Search by name, skill or interest..." oninput="filterStudents()"></div>
 <div id="studentGrid" class="grid grid-3">${studentCards(data.students).join("")}</div>`,"students")
}
function studentCards(arr){return arr.map(s=>`<article class="card"><div style="display:flex;gap:13px;align-items:center"><div class="avatar">${s.avatar||initials(s.name)}</div><div><h3>${s.name}</h3><p class="muted">${s.dept} • ${s.year}</p></div></div><div class="pill-row">${(s.skills||[]).map(x=>`<span class="pill">${x}</span>`).join("")}</div><p class="muted" style="margin-top:12px">Interests: ${(s.interests||[]).join(" · ")}</p><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="connect('${s.name}')">Connect</button></article>`)}
function filterStudents(){const q=document.getElementById("studentSearch").value.toLowerCase();document.getElementById("studentGrid").innerHTML=studentCards(data.students.filter(s=>JSON.stringify(s).toLowerCase().includes(q))).join("")||`<div class="card empty" style="grid-column:1/-1">No students found.</div>`}
function connect(name){toast(`Connection request sent to ${name}.`)}

function profile(){
 const u=user();
 layout(`<div class="card" style="padding:0;overflow:hidden"><div class="profile-cover"></div><div class="profile-info"><div class="avatar profile-avatar">${initials(u.name)}</div><div class="profile-name">${u.name}</div><p class="muted">${u.dept} • ${u.year} · ${u.email}</p><div class="pill-row"><span class="pill">JavaScript</span><span class="pill">Python</span><span class="pill">Campus Life</span></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-primary" onclick="editProfile()">Edit profile</button><button class="btn btn-light" onclick="logout()">Log out</button></div></div></div>
 <div class="grid grid-3" style="margin-top:18px">${stat("👥","24","Connections")}${stat("📅","7","Events attended")}${stat("💬","12","Posts")}</div>`,"profile")
}
function editProfile(){
 const u=user();modal("Edit profile",`<form onsubmit="saveProfile(event)"><div class="form-group"><label>Name</label><input id="editName" value="${u.name}" required></div><div class="form-group"><label>Department</label><input id="editDept" value="${u.dept}" required></div><div class="form-group"><label>Year</label><select id="editYear">${["1st Year","2nd Year","3rd Year","4th Year"].map(y=>`<option ${u.year===y?"selected":""}>${y}</option>`).join("")}</select></div><button class="btn btn-primary" style="width:100%">Save changes</button></form>`)
}
function saveProfile(e){e.preventDefault();const u=user();u.name=document.getElementById("editName").value;u.dept=document.getElementById("editDept").value;u.year=document.getElementById("editYear").value;u.avatar=initials(u.name);localStorage.setItem(KEY,JSON.stringify(u));closeModal();profile();toast("Profile updated!")}
function notifications(){
 layout(`<div class="page-title"><div><h1>Notifications</h1><p>Stay updated with your campus activity.</p></div></div>
 <div class="grid grid-2"><div class="card">${[
 ["📅","HackSRM 2026","Registration is open. Event starts on 25 Sep."],
 ["🏛️","Coding Club","New workshop announced for next week."],
 ["💬","Community","Someone replied to a discussion you follow."],
 ["👥","Student Connect","You have a new connection request."]
 ].map(n=>`<div style="display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--border)"><div class="stat-icon">${n[0]}</div><div><b>${n[1]}</b><p class="muted" style="font-size:13px;margin-top:4px">${n[2]}</p></div></div>`).join("")}</div></div>`,"")
}
function addEvent(){
 modal("Create campus event",`<form onsubmit="createEvent(event)"><div class="form-grid"><div class="form-group"><label>Event title</label><input id="evTitle" required></div><div class="form-group"><label>Category</label><select id="evCat"><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option></select></div><div class="form-group"><label>Date</label><input id="evDate" placeholder="25 Sep 2026" required></div><div class="form-group"><label>Time</label><input id="evTime" placeholder="10:00 AM" required></div><div class="form-group full"><label>Venue</label><input id="evPlace" placeholder="Event location" required></div><div class="form-group full"><label>Description</label><textarea id="evDesc" required></textarea></div></div><button class="btn btn-primary" style="width:100%">Create event</button></form>`)
}
function createEvent(e){e.preventDefault();data.events.unshift({id:Date.now(),title:evTitle.value,category:evCat.value,date:evDate.value,time:evTime.value,place:evPlace.value,members:0,desc:evDesc.value,type:evCat.value.toLowerCase()});saveData(data);closeModal();events();toast("Event created!")}

function vote(x){toast(`Vote recorded for "${x}".`)}
function logout(){localStorage.removeItem(KEY);location.hash="login"}

function router(){
 if(!user()){loginPage();return}
 const page=location.hash.replace("#","")||"dashboard";
 ({dashboard,events,clubs,community,students,profile,notifications}[page]||dashboard)();
}
window.addEventListener("hashchange",router);
router();
</script></body></html>
